<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Current phishing pipeline flow</title>
  <desc id="desc">Diagram of the current pipeline stages from input URLs through lexical admission, fetch and scoring, OCR/TVC and enrichment, final classification, and submission outputs.</desc>
  <defs>
    <style>
      .bg { fill: #f5f1e8; }
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #1f2d2a; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #475854; }
      .group { fill: #efe6d2; stroke: #c8b899; stroke-width: 2; rx: 26; }
      .box { fill: #fffdf8; stroke: #2f4a45; stroke-width: 2.4; rx: 18; }
      .debug { fill: #fff4dc; stroke: #b77715; stroke-width: 2; rx: 18; }
      .output { fill: #edf7ef; stroke: #2d6a41; stroke-width: 2; rx: 18; }
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #17322d; }
      .body { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #314440; }
      .groupLabel { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #4e5a57; }
      .arrow { stroke: #355852; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrowThin { stroke: #8d6e35; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .legend { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #41504c; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#355852"/>
    </marker>
    <marker id="arrowHeadThin" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8d6e35"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1320"/>
  <text class="title" x="70" y="68">Current Phishing Pipeline Flow</text>
  <text class="subtitle" x="70" y="96">Lexical-first admission, fetched evidence validation, second-pass OCR/TVC, and final 3-way labeling.</text>

  <rect class="group" x="48" y="132" width="1704" height="276"/>
  <text class="groupLabel" x="72" y="168">Stage 0-1: Input, DNS Gate, and Stage 1 Shortlisting</text>

  <rect class="box" x="80" y="200" width="250" height="130"/>
  <text class="label" x="105" y="238">Input URLs</text>
  <text class="body" x="105" y="268">`urls.xlsx` / holdout Excel files</text>
  <text class="body" x="105" y="292">Loaded into the Step 1 hashing</text>
  <text class="body" x="105" y="314">shortlisting stream.</text>

  <rect class="box" x="382" y="200" width="250" height="130"/>
  <text class="label" x="407" y="238">DNS Gate</text>
  <text class="body" x="407" y="268">Asynchronous A / AAAA resolution</text>
  <text class="body" x="407" y="292">Accept only resolvable hosts</text>
  <text class="body" x="407" y="314">before browser fetch begins.</text>

  <rect class="box" x="684" y="200" width="276" height="130"/>
  <text class="label" x="709" y="238">Prefetch Lexical Analysis</text>
  <text class="body" x="709" y="268">Old fuzzy shortlist + hybrid lexical</text>
  <text class="body" x="709" y="292">Strict lexical hit / lexical score pass</text>
  <text class="body" x="709" y="314">Fallback rank tracked, not promoted.</text>

  <rect class="box" x="1012" y="200" width="298" height="130"/>
  <text class="label" x="1037" y="238">Playwright Fetch + Evidence</text>
  <text class="body" x="1037" y="268">HTML + screenshot + favicon / SSL /</text>
  <text class="body" x="1037" y="292">HTML / domain hash + keywords</text>
  <text class="body" x="1037" y="314">Visible text excerpt saved for Stage 2.</text>

  <rect class="box" x="1362" y="200" width="338" height="130"/>
  <text class="label" x="1387" y="238">Evidence Scoring + Union Admission</text>
  <text class="body" x="1387" y="268">CPU lexical/hash/keyword scoring</text>
  <text class="body" x="1387" y="292">CLIP screenshot validation + hash bypass</text>
  <text class="body" x="1387" y="314">Admit strict lexical or hash-backed rows.</text>

  <rect class="debug" x="382" y="348" width="250" height="42"/>
  <text class="legend" x="405" y="375">`stage1_lexical_debug.csv` + shortlist routing debug</text>

  <rect class="debug" x="1012" y="348" width="298" height="42"/>
  <text class="legend" x="1035" y="375">`fetch_failed_lexical_hits.csv` for admitted fetch failures</text>

  <rect class="debug" x="1362" y="348" width="338" height="42"/>
  <text class="legend" x="1385" y="375">`stage1_lexical_debug.csv` + excluded URL audit</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M330 265 L382 265"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M632 265 L684 265"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M960 265 L1012 265"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M1310 265 L1362 265"/>

  <path class="arrowThin" marker-end="url(#arrowHeadThin)" d="M507 330 L507 348"/>
  <path class="arrowThin" marker-end="url(#arrowHeadThin)" d="M1161 330 L1161 348"/>
  <path class="arrowThin" marker-end="url(#arrowHeadThin)" d="M1531 330 L1531 348"/>

  <rect class="group" x="48" y="448" width="1704" height="332"/>
  <text class="groupLabel" x="72" y="484">Stage 2: Holdout, OCR/TVC, Infra Enrichment, and Supporting Models</text>

  <rect class="output" x="96" y="534" width="288" height="150"/>
  <text class="label" x="121" y="574">Stage 1 Output</text>
  <text class="body" x="121" y="604">`holdout.csv`</text>
  <text class="body" x="121" y="628">`hash_review_queue.csv`</text>
  <text class="body" x="121" y="652">Admitted rows continue even when</text>
  <text class="body" x="121" y="674">fetch failed but lexical evidence is strong.</text>

  <rect class="box" x="438" y="534" width="298" height="150"/>
  <text class="label" x="463" y="574">Second-Pass OCR / TVC</text>
  <text class="body" x="463" y="604">Fetched rows only</text>
  <text class="body" x="463" y="628">Header/footer OCR, full OCR, and HTML</text>
  <text class="body" x="463" y="652">used to detect brand claims and spoofing.</text>

  <rect class="box" x="790" y="534" width="298" height="150"/>
  <text class="label" x="815" y="574">Infra Enrichment</text>
  <text class="body" x="815" y="604">DNS records, RDAP / WHOIS, GeoIP,</text>
  <text class="body" x="815" y="628">hosting IP, ISP, country, registrant,</text>
  <text class="body" x="815" y="652">and nameserver context.</text>

  <rect class="box" x="1142" y="534" width="318" height="150"/>
  <text class="label" x="1167" y="574">Supporting Models</text>
  <text class="body" x="1167" y="604">Brand/CSE model + target-domain model</text>
  <text class="body" x="1167" y="628">48-feature frame via imputer schema</text>
  <text class="body" x="1167" y="652">Debug only, not final class labeling.</text>

  <rect class="debug" x="1514" y="534" width="198" height="150"/>
  <text class="label" x="1539" y="574">Stage 2 Debug</text>
  <text class="body" x="1539" y="604">`stage2_model_debug.csv`</text>
  <text class="body" x="1539" y="628">Model feature status,</text>
  <text class="body" x="1539" y="652">input errors, top-1 outputs.</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M384 609 L438 609"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M384 609 L790 609"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M384 609 L1142 609"/>
  <path class="arrowThin" marker-end="url(#arrowHeadThin)" d="M1460 609 L1514 609"/>

  <rect class="group" x="48" y="820" width="1704" height="430"/>
  <text class="groupLabel" x="72" y="856">Stage 3: Final Classification and Deliverables</text>

  <rect class="box" x="238" y="926" width="388" height="170"/>
  <text class="label" x="263" y="968">Final Heuristic Classification</text>
  <text class="body" x="263" y="998">`Phishing`</text>
  <text class="body" x="358" y="998">strict lexical + strong corroboration + suspicious infra</text>
  <text class="body" x="263" y="1022">`Suspected`</text>
  <text class="body" x="358" y="1022">strict lexical with weaker or fetch-failed support</text>
  <text class="body" x="263" y="1046">`Legitimate`</text>
  <text class="body" x="358" y="1046">admitted row contradicted by later evidence</text>
  <text class="body" x="263" y="1076">No fallback-only row should end up as phishing.</text>

  <rect class="debug" x="670" y="926" width="258" height="170"/>
  <text class="label" x="695" y="968">Stage 3 Debug</text>
  <text class="body" x="695" y="998">`stage3_classification_debug.csv`</text>
  <text class="body" x="695" y="1022">Evidence, OCR/TVC, infra,</text>
  <text class="body" x="695" y="1046">model agreement, final label.</text>

  <rect class="output" x="972" y="892" width="248" height="92"/>
  <text class="label" x="997" y="932">Final CSV</text>
  <text class="body" x="997" y="958">`output_file.csv`</text>

  <rect class="output" x="972" y="1012" width="248" height="92"/>
  <text class="label" x="997" y="1052">Evidence PDFs</text>
  <text class="body" x="997" y="1078">Generated only for phishing rows</text>

  <rect class="output" x="1264" y="892" width="396" height="212"/>
  <text class="label" x="1289" y="932">Submission Packaging</text>
  <text class="body" x="1289" y="962">Mapped submission Excel</text>
  <text class="body" x="1289" y="986">Required schema and evidence paths</text>
  <text class="body" x="1289" y="1016">Unpacked folder:</text>
  <text class="body" x="1289" y="1040">`output/PS-02_ISS_NLP_Submission/`</text>
  <text class="body" x="1289" y="1070">Final archive:</text>
  <text class="body" x="1289" y="1094">`Submission-holdout_sets.zip`</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M587 684 L587 926"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M939 684 L470 926"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M1301 684 L548 926"/>
  <path class="arrowThin" marker-end="url(#arrowHeadThin)" d="M626 1009 L670 1009"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M626 984 L972 938"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M626 1038 L972 1058"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M1220 938 L1264 938"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M1220 1058 L1264 1058"/>

  <rect class="box" x="80" y="892" width="114" height="188"/>
  <text class="label" x="105" y="926">Legend</text>
  <rect class="box" x="100" y="950" width="28" height="22"/>
  <text class="legend" x="140" y="966">Pipeline stage</text>
  <rect class="debug" x="100" y="988" width="28" height="22"/>
  <text class="legend" x="140" y="1004">Debug / audit artifact</text>
  <rect class="output" x="100" y="1026" width="28" height="22"/>
  <text class="legend" x="140" y="1042">Final output / deliverable</text>
  <text class="legend" x="100" y="1074">Current runtime focus:</text>
  <text class="legend" x="100" y="1098">Stage 1 admission -&gt; Stage 2 validation</text>
</svg>
