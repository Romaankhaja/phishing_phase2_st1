<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1540" viewBox="0 0 1920 1540" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline architecture execution flow</title>
  <desc id="desc">Figma-ready flow chart of the phishing pipeline showing controller bootstrap, Stage 0 lexical gate, Stage 1 HTTP rescue and hash admission, Stage 2 validation, Stage 3 classification, and submission packaging.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f3eb"/>
      <stop offset="100%" stop-color="#eef4f2"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bgGrad); }
      .panel { fill: #fbfaf6; stroke: #cfc4b0; stroke-width: 2; rx: 28; }
      .controlPanel { fill: #eff4fb; stroke: #9eb5d4; stroke-width: 2; rx: 22; }
      .routingPanel { fill: #fbf2e5; stroke: #d6b483; stroke-width: 2; rx: 22; }
      .classifyPanel { fill: #edf6ef; stroke: #9eb9a4; stroke-width: 2; rx: 22; }
      .outputPanel { fill: #f5f7ed; stroke: #b5c18c; stroke-width: 2; rx: 22; }
      .altPanel { fill: #f8f0e9; stroke: #bd9f86; stroke-width: 2; stroke-dasharray: 10 8; rx: 22; }
      .artifactPanel { fill: #fff9f0; stroke: #cfb27b; stroke-width: 2; rx: 18; }
      .rejectPanel { fill: #fff3ef; stroke: #d2927f; stroke-width: 2; rx: 18; }
      .header { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #20322f; }
      .subheader { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #4f6360; }
      .groupTitle { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #31433f; }
      .groupMeta { font: 600 13px Consolas, 'Courier New', monospace; fill: #677a77; }
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #20322f; }
      .body { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #334542; }
      .meta { font: 600 12px Consolas, 'Courier New', monospace; fill: #6a756f; }
      .chipText { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #ffffff; letter-spacing: 0.4px; }
      .legend { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #4c5d59; }
      .arrow { stroke: #42635d; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrowSoft { stroke: #8c6d39; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrowDash { stroke: #8a6f59; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; }
      .flowLabel { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #6b5329; }
      .noteBadge { fill: #ffffff; stroke: #d3c7b2; stroke-width: 1.6; rx: 16; }
      .chipCtrl { fill: #587aa5; rx: 12; }
      .chipStage { fill: #b7761d; rx: 12; }
      .chipClassify { fill: #4c7b58; rx: 12; }
      .chipOut { fill: #7b8a45; rx: 12; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#42635d"/>
    </marker>
    <marker id="arrowHeadSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8c6d39"/>
    </marker>
    <marker id="arrowHeadDash" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8a6f59"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1540"/>
  <circle cx="1630" cy="140" r="210" fill="#ffffff" opacity="0.35"/>
  <circle cx="210" cy="1420" r="240" fill="#ffffff" opacity="0.18"/>

  <text class="header" x="70" y="78">Pipeline Architecture Execution Flow</text>
  <text class="subheader" x="70" y="108">Figma-importable SVG of the current controller -> shortlisting -> classification -> packaging flow. Default runtime path is hash_only; the legacy OCR stream is shown as an alternate branch.</text>

  <rect class="noteBadge" x="1454" y="42" width="396" height="78"/>
  <text class="legend" x="1482" y="72">Solid arrows = default execution path</text>
  <text class="legend" x="1482" y="96">Dashed box = alternate legacy_ocr path</text>

  <rect class="panel" x="60" y="140" width="1800" height="190"/>
  <text class="groupTitle" x="86" y="178">Control Plane</text>
  <text class="groupMeta" x="86" y="202">main_controller.py</text>

  <rect class="controlPanel" x="90" y="220" width="280" height="84"/>
  <rect class="chipCtrl" x="110" y="236" width="58" height="24"/>
  <text class="chipText" x="123" y="253">CTRL</text>
  <text class="label" x="110" y="282">CLI + Runtime Profile</text>
  <text class="body" x="110" y="302">Args, mode, thresholds, concurrency profile.</text>

  <rect class="controlPanel" x="410" y="220" width="300" height="84"/>
  <rect class="chipCtrl" x="430" y="236" width="58" height="24"/>
  <text class="chipText" x="443" y="253">CTRL</text>
  <text class="label" x="430" y="282">Run Context + Manifest</text>
  <text class="body" x="430" y="302">Builds checkpoint store, run_id, stall watchdog.</text>

  <rect class="controlPanel" x="750" y="220" width="300" height="84"/>
  <rect class="chipCtrl" x="770" y="236" width="58" height="24"/>
  <text class="chipText" x="783" y="253">CTRL</text>
  <text class="label" x="770" y="282">Lazy Module Import</text>
  <text class="body" x="770" y="302">Loads comparison.py and pipeline.py entrypoints.</text>

  <rect class="controlPanel" x="1090" y="220" width="740" height="84"/>
  <rect class="chipCtrl" x="1110" y="236" width="58" height="24"/>
  <text class="chipText" x="1123" y="253">CTRL</text>
  <text class="label" x="1110" y="282">Controller Dispatch</text>
  <text class="body" x="1110" y="302">Step 1 runs run_hashing_shortlist_async(). If smoke test stops early, execution ends here. Otherwise Step 2 calls run_pipeline() and finally package_results().</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M370 262 L410 262"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M710 262 L750 262"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M1050 262 L1090 262"/>

  <rect class="panel" x="60" y="350" width="1800" height="430"/>
  <text class="groupTitle" x="86" y="388">Step 1: Shortlisting and Admission</text>
  <text class="groupMeta" x="86" y="412">phishing_pipeline/comparison.py</text>

  <rect class="routingPanel" x="90" y="438" width="230" height="122"/>
  <rect class="chipStage" x="110" y="454" width="50" height="24"/>
  <text class="chipText" x="126" y="471">IN</text>
  <text class="label" x="110" y="504">Input URL Records</text>
  <text class="body" x="110" y="528">
    <tspan x="110" dy="0">Load Excel feeds from holdout folder.</tspan>
    <tspan x="110" dy="18">Keep source workbook metadata per URL.</tspan>
  </text>

  <rect class="routingPanel" x="350" y="438" width="300" height="122"/>
  <rect class="chipStage" x="370" y="454" width="50" height="24"/>
  <text class="chipText" x="386" y="471">S0</text>
  <text class="label" x="370" y="504">Lexical Gate</text>
  <text class="body" x="370" y="528">
    <tspan x="370" dy="0">Single-pass lexical shortlist.</tspan>
    <tspan x="370" dy="18">Hits proceed immediately toward hashing.</tspan>
    <tspan x="370" dy="18">Misses are considered for cheap HTTP rescue.</tspan>
  </text>

  <rect class="routingPanel" x="680" y="438" width="300" height="122"/>
  <rect class="chipStage" x="700" y="454" width="50" height="24"/>
  <text class="chipText" x="716" y="471">S1</text>
  <text class="label" x="700" y="504">Cheap HTTP Rescue</text>
  <text class="body" x="700" y="528">
    <tspan x="700" dy="0">DNS / TLS / HEAD / GET / HTML checks.</tspan>
    <tspan x="700" dy="18">Scores lexical misses for escalate_to_hashing.</tspan>
    <tspan x="700" dy="18">Non-escalated rows stay in audit outputs.</tspan>
  </text>

  <rect class="routingPanel" x="1010" y="438" width="300" height="122"/>
  <rect class="chipStage" x="1030" y="454" width="58" height="24"/>
  <text class="chipText" x="1043" y="471">S1B</text>
  <text class="label" x="1030" y="504">Hash Scoring</text>
  <text class="body" x="1030" y="528">
    <tspan x="1030" dy="0">Screenshot, favicon, SSL, HTML, domain hash.</tspan>
    <tspan x="1030" dy="18">Evidence score and confidence band assignment.</tspan>
    <tspan x="1030" dy="18">Produces candidate rows for holdout admission.</tspan>
  </text>

  <rect class="routingPanel" x="1340" y="438" width="490" height="122"/>
  <rect class="chipStage" x="1360" y="454" width="58" height="24"/>
  <text class="chipText" x="1373" y="471">S1C</text>
  <text class="label" x="1360" y="504">Admission Decision</text>
  <text class="body" x="1360" y="528">
    <tspan x="1360" dy="0">Admits strict lexical hits and rescued hash-backed rows.</tspan>
    <tspan x="1360" dy="18">Separates review-only rows from holdout survivors.</tspan>
    <tspan x="1360" dy="18">Writes stage-level artifacts for later classification.</tspan>
  </text>

  <rect class="rejectPanel" x="350" y="620" width="300" height="100"/>
  <text class="label" x="372" y="658">Excluded Audit</text>
  <text class="body" x="372" y="682">
    <tspan x="372" dy="0">Lexical rejects and non-escalated Stage 1 misses.</tspan>
    <tspan x="372" dy="18">Keeps routing visibility without admitting them.</tspan>
  </text>

  <rect class="artifactPanel" x="680" y="620" width="300" height="100"/>
  <text class="label" x="702" y="658">Review Queue</text>
  <text class="body" x="702" y="682">
    <tspan x="702" dy="0">hash_review_queue.csv</tspan>
    <tspan x="702" dy="18">Weak-evidence or review-only rows.</tspan>
  </text>

  <rect class="artifactPanel" x="1010" y="620" width="820" height="100"/>
  <text class="label" x="1032" y="658">Stage 1 Outputs</text>
  <text class="body" x="1032" y="682">
    <tspan x="1032" dy="0">holdout.csv, output/hash_folder/*.csv, stage1_lexical_debug.csv, stage1_methods_debug.csv, stage1_deep_analysis_candidates.csv, fetch_failed_lexical_hits.csv</tspan>
    <tspan x="1032" dy="18">These artifacts are the handoff between Step 1 routing and Step 2 classification.</tspan>
  </text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M320 499 L350 499"/>
  <path class="arrowSoft" marker-end="url(#arrowHeadSoft)" d="M650 499 L680 499"/>
  <path class="arrowSoft" marker-end="url(#arrowHeadSoft)" d="M980 499 L1010 499"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M1310 499 L1340 499"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M650 470 C820 410, 945 410, 1010 470"/>
  <text class="flowLabel" x="746" y="430">lexical hits</text>
  <path class="arrowSoft" marker-end="url(#arrowHeadSoft)" d="M500 560 L500 620"/>
  <text class="flowLabel" x="438" y="595">non-escalated</text>
  <path class="arrowSoft" marker-end="url(#arrowHeadSoft)" d="M1490 560 L830 620"/>
  <path class="arrowSoft" marker-end="url(#arrowHeadSoft)" d="M1490 560 L1420 620"/>

  <rect class="panel" x="60" y="810" width="1800" height="470"/>
  <text class="groupTitle" x="86" y="848">Step 2: Validation, Classification, and Output Assembly</text>
  <text class="groupMeta" x="86" y="872">phishing_pipeline/pipeline.py | default path: pipeline_mode=hash_only</text>

  <rect class="classifyPanel" x="90" y="900" width="270" height="134"/>
  <rect class="chipClassify" x="110" y="916" width="58" height="24"/>
  <text class="chipText" x="123" y="933">S2 IN</text>
  <text class="label" x="110" y="966">Holdout + Whitelist Filter</text>
  <text class="body" x="110" y="990">
    <tspan x="110" dy="0">Reads holdout.csv from Step 1.</tspan>
    <tspan x="110" dy="18">Intersects rows with PS-02 whitelist domains.</tspan>
    <tspan x="110" dy="18">Can reuse an existing holdout when requested.</tspan>
  </text>

  <rect class="classifyPanel" x="390" y="900" width="270" height="134"/>
  <rect class="chipClassify" x="410" y="916" width="58" height="24"/>
  <text class="chipText" x="423" y="933">S2</text>
  <text class="label" x="410" y="966">Resume + Worker Queue</text>
  <text class="body" x="410" y="990">
    <tspan x="410" dy="0">Skips completed record keys on resume.</tspan>
    <tspan x="410" dy="18">Creates classify workers and watchdog tracking.</tspan>
    <tspan x="410" dy="18">Each row then follows the next three boxes.</tspan>
  </text>

  <rect class="classifyPanel" x="690" y="900" width="320" height="134"/>
  <rect class="chipClassify" x="710" y="916" width="58" height="24"/>
  <text class="chipText" x="723" y="933">S2</text>
  <text class="label" x="710" y="966">Evidence Recovery</text>
  <text class="body" x="710" y="990">
    <tspan x="710" dy="0">Fetched rows only: OCR/TVC from screenshot path.</tspan>
    <tspan x="710" dy="18">Reuses visible text, title text, and landing URL.</tspan>
    <tspan x="710" dy="18">Non-fetched rows take the reduced rescue path.</tspan>
  </text>

  <rect class="classifyPanel" x="1040" y="900" width="320" height="134"/>
  <rect class="chipClassify" x="1060" y="916" width="58" height="24"/>
  <text class="chipText" x="1073" y="933">S2</text>
  <text class="label" x="1060" y="966">Infra + Model Enrichment</text>
  <text class="body" x="1060" y="990">
    <tspan x="1060" dy="0">Refresh network features, DNS, RDAP/WHOIS, GeoIP.</tspan>
    <tspan x="1060" dy="18">Runs supporting brand and domain agreement models.</tspan>
    <tspan x="1060" dy="18">Adds registrar, host, and corroboration context.</tspan>
  </text>

  <rect class="classifyPanel" x="1390" y="900" width="440" height="134"/>
  <rect class="chipClassify" x="1410" y="916" width="58" height="24"/>
  <text class="chipText" x="1423" y="933">S3</text>
  <text class="label" x="1410" y="966">Final Classification</text>
  <text class="body" x="1410" y="990">
    <tspan x="1410" dy="0">Hybrid decision emits Phishing or Suspected outputs.</tspan>
    <tspan x="1410" dy="18">Legitimate and REVIEW_ONLY rows sink into review artifacts.</tspan>
    <tspan x="1410" dy="18">Checkpoint events and debug records are appended per row.</tspan>
  </text>

  <rect class="artifactPanel" x="390" y="1080" width="280" height="104"/>
  <text class="label" x="412" y="1120">Stage 2 Debug</text>
  <text class="body" x="412" y="1144">stage2_model_debug.csv</text>
  <text class="body" x="412" y="1162">Model usability and agreement traces.</text>

  <rect class="artifactPanel" x="700" y="1080" width="320" height="104"/>
  <text class="label" x="722" y="1120">Stage 3 Debug</text>
  <text class="body" x="722" y="1144">stage3_classification_debug.csv</text>
  <text class="body" x="722" y="1162">Final label reasoning and survival path.</text>

  <rect class="outputPanel" x="1050" y="1080" width="300" height="104"/>
  <rect class="chipOut" x="1070" y="1096" width="58" height="24"/>
  <text class="chipText" x="1086" y="1113">OUT</text>
  <text class="label" x="1070" y="1144">Final CSV</text>
  <text class="body" x="1070" y="1168">output_file.csv</text>

  <rect class="outputPanel" x="1380" y="1080" width="450" height="104"/>
  <rect class="chipOut" x="1400" y="1096" width="58" height="24"/>
  <text class="chipText" x="1416" y="1113">OUT</text>
  <text class="label" x="1400" y="1144">Filtered Output + Review State</text>
  <text class="body" x="1400" y="1168">output_file_filtered.csv, hash_review_queue.csv, evidence directory</text>

  <rect class="altPanel" x="390" y="1210" width="1440" height="46"/>
  <text class="legend" x="416" y="1238">Alternate branch: pipeline_mode=legacy_ocr uses the older streaming path inside pipeline.py (screenshots -> OCR queue -> Phase 2 WHOIS/RDAP queue -> classify) before packaging.</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M360 967 L390 967"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M660 967 L690 967"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M1010 967 L1040 967"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M1360 967 L1390 967"/>
  <path class="arrowSoft" marker-end="url(#arrowHeadSoft)" d="M1610 1034 L530 1080"/>
  <path class="arrowSoft" marker-end="url(#arrowHeadSoft)" d="M1610 1034 L860 1080"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M1610 1034 L1200 1080"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M1610 1034 L1605 1080"/>

  <rect class="panel" x="60" y="1310" width="1800" height="170"/>
  <text class="groupTitle" x="86" y="1348">Packaging and Submission</text>
  <text class="groupMeta" x="86" y="1372">phishing_pipeline/pipeline.py :: package_results()</text>

  <rect class="noteBadge" x="90" y="1388" width="360" height="60"/>
  <text class="legend" x="114" y="1415">Imports cleanly into Figma as editable vectors.</text>
  <text class="legend" x="114" y="1438">Use this SVG as the presentation baseline.</text>

  <rect class="outputPanel" x="520" y="1378" width="320" height="82"/>
  <rect class="chipOut" x="540" y="1394" width="58" height="24"/>
  <text class="chipText" x="556" y="1411">OUT</text>
  <text class="label" x="540" y="1436">package_results()</text>
  <text class="body" x="540" y="1454">Picks main output or filtered fallback.</text>

  <rect class="outputPanel" x="890" y="1378" width="360" height="82"/>
  <rect class="chipOut" x="910" y="1394" width="58" height="24"/>
  <text class="chipText" x="926" y="1411">OUT</text>
  <text class="label" x="910" y="1436">Submission Folder</text>
  <text class="body" x="910" y="1454">Excel mapping + evidence directory structure.</text>

  <rect class="outputPanel" x="1300" y="1378" width="530" height="82"/>
  <rect class="chipOut" x="1320" y="1394" width="58" height="24"/>
  <text class="chipText" x="1336" y="1411">OUT</text>
  <text class="label" x="1320" y="1436">Final Archive</text>
  <text class="body" x="1320" y="1454">Submission-&lt;input_folder&gt;.zip ready for handoff.</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M840 1419 L890 1419"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M1250 1419 L1300 1419"/>

  <path class="arrow" marker-end="url(#arrowHead)" d="M1510 304 L1510 350"/>
  <text class="flowLabel" x="1528" y="332">Step 1</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M1420 720 L225 900"/>
  <text class="flowLabel" x="1356" y="760">Step 2 via holdout.csv</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M1605 1184 L1605 1310"/>
  <text class="flowLabel" x="1622" y="1252">package</text>

  <text class="meta" x="70" y="1510">Source mapping: main_controller.py -> comparison.py -> pipeline.py -> package_results()</text>
  <text class="meta" x="1648" y="1510">Updated for current repo flow</text>
</svg>
