<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Hash Only Ray Pipeline Architecture</title>
  <desc id="desc">Black and white flow chart of the phishing detection pipeline architecture using Ray for hash_only mode.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 14; ry: 14; }
      .small { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 10; ry: 10; }
      .label { fill: #000000; font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; }
      .text { fill: #000000; font-family: Arial, Helvetica, sans-serif; font-size: 18px; }
      .mono { fill: #000000; font-family: "Courier New", monospace; font-size: 17px; }
      .arrow { stroke: #000000; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #000000; stroke-width: 2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#000000"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>

  <text class="label" x="800" y="42" text-anchor="middle">Hash-Only Ray Pipeline Architecture</text>

  <rect class="box" x="50" y="80" width="250" height="90"/>
  <text class="label" x="175" y="118" text-anchor="middle">Input Source</text>
  <text class="text" x="175" y="148" text-anchor="middle">Excel holdout sets / URL records</text>

  <rect class="box" x="360" y="80" width="300" height="90"/>
  <text class="label" x="510" y="118" text-anchor="middle">Main Controller</text>
  <text class="text" x="510" y="148" text-anchor="middle">CLI + runtime profile + backend select</text>

  <rect class="box" x="720" y="80" width="300" height="90"/>
  <text class="label" x="870" y="118" text-anchor="middle">Ray Runtime</text>
  <text class="text" x="870" y="148" text-anchor="middle">local / cluster init + resource-aware scheduling</text>

  <rect class="box" x="1080" y="80" width="460" height="90"/>
  <text class="label" x="1310" y="118" text-anchor="middle">Checkpoint + Metrics Actors</text>
  <text class="text" x="1310" y="148" text-anchor="middle">run manifest, stage events, counters, failures, heartbeats</text>

  <rect class="box" x="130" y="250" width="310" height="120"/>
  <text class="label" x="285" y="292" text-anchor="middle">Stage 0</text>
  <text class="text" x="285" y="324" text-anchor="middle">Lexical shortlist / typo / fuzzy gate</text>
  <text class="mono" x="285" y="352" text-anchor="middle">Ray batched tasks</text>

  <rect class="box" x="520" y="250" width="260" height="120"/>
  <text class="label" x="650" y="292" text-anchor="middle">Router</text>
  <text class="text" x="650" y="324" text-anchor="middle">Lexical hits -> Hash lane</text>
  <text class="text" x="650" y="352" text-anchor="middle">Lexical misses -> Stage 1</text>

  <rect class="box" x="860" y="220" width="320" height="85"/>
  <text class="label" x="1020" y="255" text-anchor="middle">Stage 1 Fetch Pool</text>
  <text class="text" x="1020" y="285" text-anchor="middle">Reusable HTTP session actors</text>

  <rect class="box" x="860" y="325" width="320" height="85"/>
  <text class="label" x="1020" y="360" text-anchor="middle">Stage 1 Parse / Score</text>
  <text class="text" x="1020" y="390" text-anchor="middle">Stateless Ray tasks</text>

  <rect class="box" x="860" y="430" width="320" height="110"/>
  <text class="label" x="1020" y="468" text-anchor="middle">Stage 1 Enrich Pool</text>
  <text class="text" x="1020" y="500" text-anchor="middle">DNS / RDAP / TLS actors</text>
  <text class="text" x="1020" y="526" text-anchor="middle">Lookup cache actors reused</text>

  <rect class="box" x="1230" y="300" width="260" height="110"/>
  <text class="label" x="1360" y="338" text-anchor="middle">Stage 1 Decision</text>
  <text class="text" x="1360" y="370" text-anchor="middle">Escalate to hash or</text>
  <text class="text" x="1360" y="396" text-anchor="middle">filter / review-only</text>

  <rect class="box" x="120" y="520" width="330" height="110"/>
  <text class="label" x="285" y="558" text-anchor="middle">Hash Browser Pool</text>
  <text class="text" x="285" y="590" text-anchor="middle">Long-lived Playwright browser actors</text>
  <text class="text" x="285" y="616" text-anchor="middle">Reusable contexts / pages</text>

  <rect class="box" x="520" y="520" width="260" height="110"/>
  <text class="label" x="650" y="558" text-anchor="middle">Hash Enrich</text>
  <text class="text" x="650" y="590" text-anchor="middle">Aux HTTP + page artifacts</text>
  <text class="text" x="650" y="616" text-anchor="middle">Stateless Ray tasks</text>

  <rect class="box" x="860" y="520" width="320" height="110"/>
  <text class="label" x="1020" y="558" text-anchor="middle">Hash Finalize</text>
  <text class="text" x="1020" y="590" text-anchor="middle">Similarity / scoring / admission</text>
  <text class="text" x="1020" y="616" text-anchor="middle">Independent CPU task batch</text>

  <rect class="box" x="1230" y="520" width="260" height="110"/>
  <text class="label" x="1360" y="558" text-anchor="middle">Holdout Sink</text>
  <text class="text" x="1360" y="590" text-anchor="middle">shortlist output</text>
  <text class="mono" x="1360" y="616" text-anchor="middle">output/holdout.csv</text>

  <rect class="box" x="120" y="730" width="300" height="100"/>
  <text class="label" x="270" y="768" text-anchor="middle">Whitelist Filter</text>
  <text class="text" x="270" y="798" text-anchor="middle">PS-02 legitimate domain filter</text>

  <rect class="box" x="470" y="700" width="290" height="75"/>
  <text class="label" x="615" y="732" text-anchor="middle">OCR Worker Actors</text>
  <text class="text" x="615" y="758" text-anchor="middle">GPU only if visible / available</text>

  <rect class="box" x="470" y="795" width="290" height="75"/>
  <text class="label" x="615" y="827" text-anchor="middle">WHOIS Coordinator</text>
  <text class="text" x="615" y="853" text-anchor="middle">Throttled stateful actor</text>

  <rect class="box" x="840" y="730" width="360" height="140"/>
  <text class="label" x="1020" y="768" text-anchor="middle">Hash-Only Classifier Pool</text>
  <text class="text" x="1020" y="798" text-anchor="middle">Ray classifier actors with warmed models</text>
  <text class="text" x="1020" y="824" text-anchor="middle">network features + OCR/TVC + WHOIS/RDAP</text>
  <text class="text" x="1020" y="850" text-anchor="middle">final decision / review sink / debug rows</text>

  <rect class="box" x="1260" y="710" width="280" height="180"/>
  <text class="label" x="1400" y="748" text-anchor="middle">Final Outputs</text>
  <text class="text" x="1400" y="780" text-anchor="middle">output_file.csv</text>
  <text class="text" x="1400" y="808" text-anchor="middle">output_file_filtered.csv</text>
  <text class="text" x="1400" y="836" text-anchor="middle">hash_review_queue.csv</text>
  <text class="text" x="1400" y="864" text-anchor="middle">stage2 / stage3 debug CSVs</text>

  <line class="arrow" x1="300" y1="125" x2="360" y2="125"/>
  <line class="arrow" x1="660" y1="125" x2="720" y2="125"/>
  <line class="arrow" x1="1020" y1="125" x2="1080" y2="125"/>

  <line class="arrow" x1="285" y1="170" x2="285" y2="250"/>
  <line class="arrow" x1="440" y1="310" x2="520" y2="310"/>

  <line class="arrow" x1="780" y1="290" x2="860" y2="262"/>
  <line class="arrow" x1="780" y1="330" x2="860" y2="575"/>

  <line class="arrow" x1="1020" y1="305" x2="1020" y2="325"/>
  <line class="arrow" x1="1020" y1="410" x2="1020" y2="430"/>
  <line class="arrow" x1="1180" y1="485" x2="1230" y2="355"/>
  <line class="arrow" x1="1490" y1="355" x2="1490" y2="575"/>
  <line class="arrow" x1="1490" y1="575" x2="1490" y2="575"/>

  <line class="arrow" x1="450" y1="575" x2="520" y2="575"/>
  <line class="arrow" x1="780" y1="575" x2="860" y2="575"/>
  <line class="arrow" x1="1180" y1="575" x2="1230" y2="575"/>

  <line class="arrow" x1="1360" y1="630" x2="1360" y2="690"/>
  <line class="arrow" x1="1360" y1="690" x2="420" y2="780"/>
  <line class="arrow" x1="420" y1="780" x2="470" y2="780"/>

  <line class="dash" x1="615" y1="775" x2="615" y2="795"/>
  <line class="arrow" x1="420" y1="780" x2="840" y2="800"/>
  <line class="arrow" x1="760" y1="738" x2="840" y2="770"/>
  <line class="arrow" x1="760" y1="832" x2="840" y2="832"/>
  <line class="arrow" x1="1200" y1="800" x2="1260" y2="800"/>

  <line class="dash" x1="1310" y1="170" x2="1310" y2="710"/>

  <rect class="small" x="70" y="900" width="1460" height="48"/>
  <text class="text" x="800" y="930" text-anchor="middle">
    Stage isolation: lexical, cheap HTTP, browser hashing, and final classification run as separate Ray-scheduled lanes with localized backpressure.
  </text>
</svg>
